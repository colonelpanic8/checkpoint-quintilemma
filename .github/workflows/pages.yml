name: GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build PDF with Nix
        run: nix build .#checkpoint-quadrilemma --print-build-logs

      - name: Prepare site
        run: |
          mkdir -p _site
          cp result/checkpoint_quadrilemma.pdf _site/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>The Checkpoint Quadrilemma</title>
              <style>
                body {
                  margin: 0;
                  background: #f5f4ef;
                  color: #1f2933;
                  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                }

                header {
                  align-items: center;
                  display: flex;
                  gap: 1rem;
                  justify-content: space-between;
                  padding: 0.85rem 1rem;
                }

                h1 {
                  font-size: 1rem;
                  font-weight: 650;
                  line-height: 1.2;
                  margin: 0;
                }

                a {
                  color: #174ea6;
                  font-weight: 600;
                  text-decoration: none;
                  white-space: nowrap;
                }

                a:hover {
                  text-decoration: underline;
                }

                iframe {
                  border: 0;
                  display: block;
                  height: calc(100vh - 3.2rem);
                  width: 100%;
                }
              </style>
            </head>
            <body>
              <header>
                <h1>The Checkpoint Quadrilemma</h1>
                <a href="checkpoint_quadrilemma.pdf">Open PDF</a>
              </header>
              <iframe src="checkpoint_quadrilemma.pdf" title="The Checkpoint Quadrilemma PDF"></iframe>
            </body>
          </html>
          HTML

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
